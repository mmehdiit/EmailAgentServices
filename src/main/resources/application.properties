# Server
server.port=8080

# Database - PostgreSQL
spring.datasource.url=jdbc:postgresql://192.168.55.115:5432/emailagent
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=8e215bd826df4fb9a2fb4b2c2aad7e779b17bbb783d294634448ac3090afde8d
app.jwt.expiration-ms=86400000

# Microsoft OAuth (Outlook)
microsoft.client-id=
microsoft.client-secret=
microsoft.redirect-uri=http://localhost:5173/dashboard

# AI Classification (Lovable AI Gateway)
ai.gateway.url=https://ai.gateway.lovable.dev/v1/chat/completions
ai.gateway.api-key=
ai.gateway.model=google/gemini-2.5-flash

# App URL (for reply tracking links)
app.url=http://localhost:5173

# Scheduled tasks
app.processing.enabled=true
app.processing.cron=0 */5 * * * *
app.reply-check.cron=0 */10 * * * *

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.emailagent=INFO
logging.level.org.springframework.security=WARN
